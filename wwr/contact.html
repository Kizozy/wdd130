<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Contact White Water Raft to plan your next unforgettable whitewater rafting adventure. Our friendly team answers questions about trips, safety, equipment, and bookings. Whether you're planning a first-time paddle or a challenging expedition, we help you choose the perfect experience and prepare for an exciting day on the water with expert guides."
    />
    <meta name="author" content="Okeke Kingsley" />
    <link rel="stylesheet" href="styles/rafting.css" />
    <title>Contact Us</title>
  </head>
  <body>
    <header>
      <img src="images/logo.jpg" alt="WhiteWater Raft logo" />
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About Us</a></li>
          <li><a href="trips.html">Trips</a></li>
          <li><a href="contact.html">Contact Us</a></li>
        </ul>
      </nav>
    </header>
    <main> 
      <section class="info">
        <address>
          14 Akirimade Close<br>
          Lagos, Nigeria<br>
          <a href="tel:+234 813 690 0045">+234 813 690 0045</a><br>
          <a href="mailto:kingsleyokeke30@gmail.com">kingsleyokeke30@gmail.com</a>
        </address>
      </section>
      <div class="map">
            <section class="map-container">
                <div class="mapped">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3962.8256421534993!2d3.268212800000012!3d6.668516199999997!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x103b975b5f1ac2a7%3A0x560549cb4fe85357!2sAkinrinmade%20Cl%2C%20Alagbado%2C%20Abule-Egba%2FAboru%2FMeiran%2FAlagbado%20102213%2C%20Lagos!5e0!3m2!1sen!2sng!4v1786232762756!5m2!1sen!2sng" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" frameborder="0"></iframe>
                </div>
            </section>
            <section class="form-container">
                <form>
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Placeholder">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Placeholder">
                    </div>

                    <fieldset class="form-group radio-group">
                        <legend>Message Purpose</legend>
                        <div class="radio-option">
                            <input type="radio" id="general" name="purpose" value="general" checked>
                            <label for="general">General Inquiry</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="reservation" name="purpose" value="reservation">
                            <label for="reservation">Reservation Question</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="suggestion" name="purpose" value="suggestion">
                            <label for="suggestion">Website Suggestion</label>
                        </div>
                    </fieldset>

                    <div class="note">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="4" placeholder="Type here"></textarea>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="subscribe" name="subscribe" checked>
                        <label for="subscribe">Please Subscribe me to the monthly newsletter</label>
                    </div>

                    <button type="submit" class="submit-btn">Get in Touch!</button>
                </form>
            </section>
        </div>
      <section class="team-section">
            <h2>We Are Here to Serve You</h2>
            <div class="teams">
                <div class="profile-card">
                    <div class="profile-image"><img src="images/ceo.jpg" alt="CEO"></div>
                    <p>CEO</p>
                </div>
                <div class="profile-card">
                    <div class="profile-image"><img src="images/manager.jpg" alt="General Manager"></div>
                    <p>General Manager</p>
                </div>
                <div class="profile-card">
                    <div class="profile-image"><img src="images/secretary.jpg" alt="General Secretary"></div>
                    <p>General Secretary</p>
                </div>
            </div>
        </section>

    </main>
    <footer>
      <p>&copy;2026 | WhiteWater Raft | Okeke Kingsley.</p>
      <nav class="socialmedia">
        <ul>
          <li>
            <a href="https://facebook.com"
              ><img src="images/facebook-bw.png" alt="Facebook icon"
            /></a>
            <a href="https://whatsapp.com"
              ><img src="images/whatsapp-bw.png" alt="Whatsapp icon"
            /></a>
            <a href="https://x.com"
              ><img src="images/x-bw.png" alt="X icon"
            /></a>
          </li>
        </ul>
      </nav>
    </footer>
  </body>
</html>
